[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundle-python"
version = "0.1.0"
description = "Extend bundle metadata with EXIF data, resolution and device info of the files in a bundle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bundle-python = "bundle_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
